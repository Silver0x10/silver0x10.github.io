<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverio Manganaro</title>
    <meta name="author" content="Silverio Manganaro">
    <meta name="description" content="Silverio Manganaro's portfolio. AI & Robotics Engineer. Rock climber, photographer, woodworker. Cinema lover.">
    <meta property="og:title" content="Silverio Manganaro">
    <meta property="og:description" content="AI & Robotics Engineer. Rock climber, photographer, woodworker. Cinema lover.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://justsilver.it/">
    <link rel="icon" href="/assets/rocket-solid.svg">
    <script>
        // apply the saved theme before first paint to avoid a flash
        document.documentElement.dataset.theme = localStorage.getItem('theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <link rel="preload" href="/assets/fonts/boldonse-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three.module.js",
            "three/addons/": "/vendor/addons/"
        }
    }
    </script>
</head>

<body class="home">

    <canvas id="bg"></canvas>

    <nav>
        <div id="menu" class="nav_section">
            <a id="rocket" href="/projects/" aria-label="Projects"><svg class="icon"><use href="/assets/icons.svg#icon-rocket"/></svg></a>
            <a id="pencil" href="/blog/" aria-label="Blog"><svg class="icon"><use href="/assets/icons.svg#icon-pen"/></svg></a>
        </div>

        <div id="contacts" class="nav_section">
            <a target="_blank" rel="noopener noreferrer" aria-label="Email me" href="mailto:silverio.manganaro@gmail.com"><svg class="icon"><use href="/assets/icons.svg#icon-envelope"/></svg></a>
            <button id="cvButton" aria-label="Download my CV"><svg class="icon"><use href="/assets/icons.svg#icon-cv"/></svg></button>
            <a target="_blank" rel="noopener noreferrer" aria-label="GitHub" href="https://github.com/Silver0x10"><svg class="icon"><use href="/assets/icons.svg#icon-github"/></svg></a>
            <a target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" href="https://www.linkedin.com/in/silverio-manganaro"><svg class="icon"><use href="/assets/icons.svg#icon-linkedin"/></svg></a>
            <a target="_blank" rel="noopener noreferrer" aria-label="Instagram" href="https://www.instagram.com/silverio_man/"><svg class="icon"><use href="/assets/icons.svg#icon-instagram"/></svg></a>
        </div>

        <div id="toggle" class="nav_section">
            <button id="themeToggle" aria-label="Toggle dark/light theme">
                <svg class="icon theme-sun"><use href="/assets/icons.svg#icon-sun"/></svg>
                <svg class="icon theme-moon"><use href="/assets/icons.svg#icon-moon"/></svg>
            </button>
        </div>
    </nav>

    <!-- handwritten notes: the arrows are drawn by main.js, label -> target -->
    <svg id="scribble-canvas" aria-hidden="true"></svg>
    <span class="scribble" id="scribble-projects" aria-hidden="true">projects</span>
    <span class="scribble" id="scribble-blog" aria-hidden="true">blog</span>
    <span class="scribble" id="scribble-donut" aria-hidden="true">try to make it spin faster!</span>

    <main>
        <section id="about">
            <!-- main.js shrinks #hero if it would reach the notes strip -->
            <div id="hero">
                <h2>hello world!</h2>
                <h1>
                    I'm <span class="accent">Silverio</span>, <br>
                    Silverio Manganaro.
                </h1>
                <h2 id="roles" aria-label="AI & Robotics Engineer, Computer Scientist, Rock Climber, Photographer, Woodworker, Runner, Hiker, Maker">
                    <span id="typed"></span><span id="caret" aria-hidden="true">_</span>
                </h2>
                <p class="tagline">
                    This should be my portfolio. <br>
                    But not only.
                </p>
            </div>
        </section>
    </main>

    <dialog id="cvDialog">
        <p>thanks for the interest! <br> tap the red button to download my cv :)</p>
        <div class="dialog-actions">
            <a id="cvDownload" class="red-button" href="/assets/cv_silverio_manganaro.pdf" download aria-label="Download CV">
                <svg class="icon"><use href="/assets/icons.svg#icon-cv"/></svg>
            </a>
        </div>
        <button id="cvClose" class="dialog-close" aria-label="Close"><svg class="icon"><use href="/assets/icons.svg#icon-x"/></svg></button>
    </dialog>

    <script type="module" src="/main.js"></script>
</body>
</html>
